<!-- Can be conditionally inserted only on pages that need it. -->
<script>
    // Lightweight lazy loader so heavy D3 setup only runs when user opens panel
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.getElementById('toggle-visualizations-btn');
        const container = document.getElementById('visualizations-container');
        let visInitialized = false;

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        async function initVisualizations() {
            if (visInitialized) return;
            // Divs already present in markup
            // Load D3 if not already loaded
            if (!window.d3) {
                await loadScript('https://cdn.jsdelivr.net/npm/d3@7');
            }
            // Load reusable select (if not already loaded by head include)
            if (!window.CustomSelect) {
                try { await loadScript('/assets/js/custom-select.js'); } catch (e) { console.warn('Failed to load custom-select.js', e); }
            }
            // Load the visualization logic (depends optionally on CustomSelect)
            await loadScript('/assets/js/visualizations.js');
            if (window.initDeploymentsVis) {
                window.initDeploymentsVis();
            }
            visInitialized = true;
        }

        function toggleVisualizations() {
            if (!container) return;
            container.classList.toggle('visible');
            if (toggleBtn) {
                toggleBtn.classList.toggle('visible');
            }
            if (container.classList.contains('visible')) {
                // Just became visible: initialize (once)
                initVisualizations();
            }
        }

        if (toggleBtn) {
            toggleBtn.addEventListener('click', toggleVisualizations);
        }
    });
</script>
