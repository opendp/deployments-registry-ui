title: Differential Privacy Deployments Registry
email: info@opendp.org
description: >-
  This resource aims to support practitioners deploying differential privacy in practice.
  It endeavors to leave the reader with a clearer intuition, responsible guidance,
  and case studies of privacy budgets used by organizations today.
baseurl: "" # the subpath of your site, e.g. /blog
url: "http://registry.opendp.org/"
owner: OpenDP
data_repo_base_url: "https://github.com/opendp/deployments-registry-data/blob/main/deployments"

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Collections
collections:
  navigation:
    output: false
  bibliography:
    output: false

# Include pages directory in processing
include:
  - pages

# Header navigation
header_pages:
  - pages/index.md

markdown: kramdown # The default: passes <script> tags through verbatim.

# Defaults for pages
defaults:
  - scope:
      path: "pages"
    values:
      layout: "docs"
  - scope:
      path: "pages/background"
    values:
      layout: "docs"
      permalink: /:basename/
  - scope:
      path: "pages/concepts"
    values:
      layout: "docs"
      permalink: /concepts/:basename/
  - scope:
      path: "pages/deployments-registry"
    values:
      layout: "main"
      permalink: /deployments-registry/:basename/
  - scope:
      path: "pages/further-information"
    values:
      layout: "docs"
      permalink: /further-information/:basename/
  - scope:
      path: "pages/privacy"
    values:
      layout: "docs"
      permalink: /privacy/:basename/

# Deployment statuses shown in the public UI (whitelist).
# See NIST IR 8588 §5.1: https://nvlpubs.nist.gov/nistpubs/ir/2025/NIST.IR.8588.ipd.pdf#page=21
published_statuses:
  - "Converted"
  - "Approved"
  - "Approved (Update Requested)"
  - "Approved (Pending)"

exclude:
  - eslint.config.mjs
  - node_modules/
  - package-lock.json
  - package.json
  - vendor
  - tests
  - .venv
  - test-results/
